services:
  db:
    image: postgres:16-alpine
    container_name: bingely-db
    restart: always
    environment:
      POSTGRES_DB: bingely
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password_here
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: